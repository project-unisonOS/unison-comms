name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit==1.7.9
      - name: Test
        env:
          PYTHONPATH: src
          OTEL_SDK_DISABLED: "true"
          DISABLE_AUTH_FOR_TESTS: "true"
          UNISON_PRINCIPAL_BINDING_TEST_BYPASS: "true"
        run: pytest -q
      - name: Bandit
        run: bandit -q -r src -ll
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: "1"
          vuln-type: "os,library"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build standalone image
        run: docker build -t unison-comms:phase5 .
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # Node 24, Syft v1.42.3
        with:
          image: unison-comms:phase5
          artifact-name: sbom-unison-comms.spdx.json
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: unison-comms:phase5
          ignore-unfixed: true
          format: table
          exit-code: "1"
          vuln-type: "os,library"
